version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: base_postgres
    restart: always
    environment:
      POSTGRES_DB: base_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      # Se agrega :Z para solucionar problemas de permisos en Podman
      - ./volumes/postgres:/var/lib/postgresql/data:Z
    networks:
      - base_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: base_backend
    depends_on:
      - postgres
    environment:
      # Asegúrate de que el Host coincida con el nombre del servicio o red
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/base_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - base_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: base_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - base_network

networks:
  base_network:
    driver: bridge
