spring.application.name=agendaapp
# Configuración del servidor
server.port=${PORT:8080}

# Configuración de PostgreSQL definida en docker-compose.yml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/base_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Mostrar los comandos SQL que hace Spring en la terminal, útil para aprender
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Origenes permitidos para el frontend local y el desplegado en Vercel
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
