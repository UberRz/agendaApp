spring.application.name=agendaapp
# Configuración del servidor
server.port=${PORT:8080}

# Configuración de PostgreSQL definida en docker-compose.yml
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Mostrar los comandos SQL que hace Spring en la terminal, útil para aprender
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Orígenes permitidos para el frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Correo
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
app.mail.from=${APP_MAIL_FROM:no-reply@agendafacil.local}
# Recuperación de contraseña y validación de correo
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.reset.token-minutes=${APP_RESET_TOKEN_MINUTES:30}
app.email.mx-validation-enabled=${APP_EMAIL_MX_VALIDATION_ENABLED:true}
