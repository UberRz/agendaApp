spring.application.name=agendaapp
# Configuración del servidor
server.port=8080

# Configuración de la base de datos temporal H2
spring.datasource.url=jdbc:h2:mem:agendadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password123

# Habilitar la consola visual de H2 en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar los comandos SQL que hace Spring en la terminal, útil para aprender
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
